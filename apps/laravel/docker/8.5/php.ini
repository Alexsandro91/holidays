; PHP configuration per il container Sail (solo sviluppo locale)
; Copiato in /etc/php/8.5/cli/conf.d/99-sail.ini dal Dockerfile: dopo ogni modifica `sail build --no-cache`

[PHP]
expose_php = Off
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
post_max_size = 100M
upload_max_filesize = 100M
max_file_uploads = 20
variables_order = EGPCS

; Errori visibili: Sail e' solo dev (le pagine d'errore Laravel dipendono comunque da APP_DEBUG)
display_errors = On
display_startup_errors = On
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Performance filesystem sul volume montato da macOS
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Coverage dei test con pcov (riga originale Sail)
pcov.directory = .

[Assertion]
zend.assertions = 1

[Date]
; Laravel sovrascrive questo valore con config('app.timezone') al boot
date.timezone = Europe/Rome
